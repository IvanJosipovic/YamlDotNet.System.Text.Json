name: PR Build & Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build-test:
    name: Build & Test
    permissions:
      contents: read
    uses: IvanJosipovic/templates/.github/workflows/csharp-build-test.yaml@main

  aot-tests:
    name: Native AOT xUnit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - run: dotnet publish tests/YamlDotNet.System.Text.Json.Tests/YamlDotNet.System.Text.Json.Tests.csproj -c Aot -f net10.0 -r linux-x64 --self-contained true -o artifacts/aot-tests
    - run: ./artifacts/aot-tests/YamlDotNet.System.Text.Json.Tests
